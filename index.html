<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Calculadora</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }

    body {
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      height: 100dvh; /* Utiliza la altura dinámica real disponible en Safari */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 6px 16px 12px 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 4px;
      padding-bottom: 2px;
    }

    .top-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: #1c1c1e;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .top-icon svg {
      fill: none;
      stroke: #fff;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .display-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 0 0px 4px 0px;
      overflow: hidden;
      width: 100%;
    }

    .expression-line {
      font-size: 24px;
      font-weight: 400;
      color: #8e8e93;
      text-align: right;
      min-height: 28px;
      line-height: 1.2;
      letter-spacing: -0.5px;
      width: 100%;
    }

    .main-line-wrapper {
      width: 100%;
      overflow-x: auto;
      white-space: nowrap;
      text-align: right;
      scrollbar-width: none;
    }

    .main-line-wrapper::-webkit-scrollbar {
      display: none;
    }

    .main-line {
      font-size: 88px; /* Subido a 88px para igualar el tamaño gigante nativo */
      font-weight: 400;
      color: #fff;
      display: inline-block;
      line-height: 1.0;
      letter-spacing: -1px;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 4px;
    }

    .btn {
      aspect-ratio: 1;
      border-radius: 50%;
      border: none;
      font-size: 32px;
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      transition: filter 0.1s ease;
    }

    .btn:active {
      filter: brightness(1.4);
    }

    .btn-dark {
      background-color: #2a2a2c;
      color: #fff;
    }

    .btn-orange {
      background-color: #ff9f0a;
      color: #fff;
      font-size: 36px;
    }

    .btn-orange:active {
      filter: brightness(1.2);
    }

    .btn svg {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .home-indicator-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 2px;
    }

    .home-indicator {
      width: 135px;
      height: 5px;
      background-color: #fff;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="top-icon">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <polyline points="12 7 12 12 15 15" />
      </svg>
    </div>
    <div class="top-icon">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <rect x="4" y="4" width="6" height="6" rx="1.5" />
        <rect x="14" y="4" width="6" height="6" rx="1.5" />
        <rect x="4" y="14" width="6" height="6" rx="1.5" />
        <rect x="14" y="14" width="6" height="6" rx="1.5" />
      </svg>
    </div>
  </div>

  <div class="display-container">
    <div class="expression-line" id="expressionLine"></div>
    <div class="main-line-wrapper" id="mainWrapper">
      <div class="main-line" id="mainLine">0</div>
    </div>
  </div>

  <div class="keypad">
    <button class="btn btn-dark" onclick="handleBackspace()">
      <svg width="26" height="26" viewBox="0 0 24 24" stroke-width="1.8">
        <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
        <line x1="18" y1="9" x2="12" y2="15"></line>
        <line x1="12" y1="9" x2="18" y2="15"></line>
      </svg>
    </button>
    <button class="btn btn-dark" id="clearBtn" onclick="handleAC()">AC</button>
    <button class="btn btn-dark" onclick="inputOperator('%')">%</button>
    <button class="btn btn-orange" onclick="inputOperator('÷')">÷</button>

    <button class="btn btn-dark" onclick="handleDigitPress('7')">7</button>
    <button class="btn btn-dark" onclick="handleDigitPress('8')">8</button>
    <button class="btn btn-dark" onclick="handleDigitPress('9')">9</button>
    <button class="btn btn-orange" onclick="inputOperator('×')">×</button>

    <button class="btn btn-dark" onclick="handleDigitPress('4')">4</button>
    <button class="btn btn-dark" onclick="handleDigitPress('5')">5</button>
    <button class="btn btn-dark" onclick="handleDigitPress('6')">6</button>
    <button class="btn btn-orange" onclick="inputOperator('-')">−</button>

    <button class="btn btn-dark" onclick="handleDigitPress('1')">1</button>
    <button class="btn btn-dark" onclick="handleDigitPress('2')">2</button>
    <button class="btn btn-dark" onclick="handleDigitPress('3')">3</button>
    <button class="btn btn-orange" onclick="inputOperator('+')">+</button>

    <button class="btn btn-dark" onclick="toggleSign()">⁺∕₋</button>
    <button class="btn btn-dark" onclick="handleDigitPress('0')">0</button>
    <button class="btn btn-dark" onclick="inputDecimal()">,</button>
    <button class="btn btn-orange" onclick="handleEqual()">=</button>
  </div>

  <div class="home-indicator-bar">
    <div class="home-indicator"></div>
  </div>

  <script>
    const mainLineEl = document.getElementById('mainLine');
    const mainWrapperEl = document.getElementById('mainWrapper');
    const expressionLineEl = document.getElementById('expressionLine');
    const clearBtnEl = document.getElementById('clearBtn');

    let currentValue = '0';
    let previousValue = null;
    let operator = null;
    let waitingForSecondOperand = false;

    let stage = 0; 
    let currentX = 0;
    let targetResult = 0;
    let forcedAddendStr = '';
    let forcedIndex = 0;

    function formatNumber(valStr) {
      if (!valStr || valStr === 'Error') return valStr;
      const parts = valStr.split(',');
      let integerPart = parts[0];
      const decimalPart = parts.length > 1 ? ',' + parts[1] : '';

      const isNegative = integerPart.startsWith('-');
      if (isNegative) integerPart = integerPart.substring(1);

      const formattedInteger = integerPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return (isNegative ? '-' : '') + formattedInteger + decimalPart;
    }

    function scrollToRight() {
      setTimeout(() => {
        mainWrapperEl.scrollLeft = mainWrapperEl.scrollWidth;
      }, 0);
    }

    function getBaseFontSizeForValue(valStr) {
      const len = valStr.length;
      if (len > 12) return 40;
      if (len > 9) return 54;
      if (len > 6) return 70;
      return 88;
    }

    function adjustDynamicFontSize(baseValueStr, secondOperandStr) {
      const baseSize = getBaseFontSizeForValue(baseValueStr);
      const addedLen = secondOperandStr ? secondOperandStr.length : 0;

      if (addedLen === 0) {
        mainLineEl.style.fontSize = `${baseSize}px`;
      } else if (addedLen === 1) {
        mainLineEl.style.fontSize = `${Math.max(baseSize - 4, 68)}px`;
      } else if (addedLen === 2) {
        mainLineEl.style.fontSize = `${Math.max(baseSize - 8, 62)}px`;
      } else if (addedLen === 3) {
        mainLineEl.style.fontSize = `${Math.max(baseSize - 12, 56)}px`;
      } else {
        mainLineEl.style.fontSize = `${Math.max(baseSize - 12, 56)}px`;
      }
    }

    function updateDisplay() {
      if (stage === 4) {
        const currentTypedAddend = forcedAddendStr.substring(0, forcedIndex);
        const formattedBase = formatNumber(String(currentX));
        const formattedAddend = currentTypedAddend ? formatNumber(currentTypedAddend) : '';
        
        mainLineEl.innerText = `${formattedBase}+${formattedAddend}`;
        adjustDynamicFontSize(formattedBase, currentTypedAddend);
        scrollToRight();
      } else if (operator) {
        const formattedBase = formatNumber(previousValue);
        const formattedSecond = !waitingForSecondOperand ? formatNumber(currentValue) : '';
        const secondRaw = !waitingForSecondOperand ? currentValue : '';

        mainLineEl.innerText = `${formattedBase}${operator}${formattedSecond}`;
        adjustDynamicFontSize(formattedBase, secondRaw);
        scrollToRight();
      } else {
        const formatted = formatNumber(currentValue);
        mainLineEl.innerText = formatted;
        mainLineEl.style.fontSize = `${getBaseFontSizeForValue(formatted)}px`;
      }

      clearBtnEl.innerText = (currentValue !== '0' || previousValue !== null || stage === 4) ? 'C' : 'AC';
    }

    function getFutureTargetNumber() {
      const now = new Date();
      now.setMinutes(now.getMinutes() + 3); // 3 minutos de desfase

      const day = String(now.getDate());
      const month = String(now.getMonth() + 1);
      const year = String(now.getFullYear());
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');

      return parseInt(`${day}${month}${year}${hours}${minutes}`, 10);
    }

    function handleDigitPress(digit) {
      if (stage === 4) {
        if (forcedIndex < forcedAddendStr.length) {
          forcedIndex++;
          updateDisplay();
        }
        return;
      }

      if (waitingForSecondOperand) {
        currentValue = digit;
        waitingForSecondOperand = false;
      } else {
        currentValue = currentValue === '0' ? digit : currentValue + digit;
      }
      updateDisplay();
    }

    function inputOperator(op) {
      if (op === '+' && stage === 0) {
        stage = 1;
      } else if (op === '+' && stage === 3) {
        stage = 4;
        targetResult = getFutureTargetNumber();
        const addendY = targetResult - currentX;
        forcedAddendStr = String(addendY);
        forcedIndex = 0;
        operator = '+';
        previousValue = String(currentX);
        waitingForSecondOperand = false;
        expressionLineEl.innerText = '';
        updateDisplay();
        return;
      }

      operator = op;
      previousValue = currentValue;
      waitingForSecondOperand = true;
      expressionLineEl.innerText = '';
      updateDisplay();
    }

    function handleEqual() {
      if (stage === 4) {
        expressionLineEl.innerText = `${formatNumber(String(currentX))}+${formatNumber(forcedAddendStr)}`;
        currentValue = String(targetResult);
        stage = 0;
        operator = null;
        previousValue = null;
        waitingForSecondOperand = false;
        updateDisplay();
        return;
      }

      if (operator === '+' && stage === 1) {
        const num1 = parseFloat(previousValue.replace(',', '.'));
        const num2 = parseFloat(currentValue.replace(',', '.'));
        const sum = num1 + num2;

        expressionLineEl.innerText = `${formatNumber(previousValue)}+${formatNumber(currentValue)}`;
        currentValue = String(sum).replace('.', ',');
        stage = 2;
        operator = null;
        previousValue = null;
        waitingForSecondOperand = false;
        updateDisplay();
        return;
      }

      if (operator === '×' && stage === 2) {
        const num1 = parseFloat(previousValue.replace(',', '.'));
        const num2 = parseFloat(currentValue.replace(',', '.'));
        currentX = Math.round(num1 * num2);

        expressionLineEl.innerText = `${formatNumber(previousValue)}×${formatNumber(currentValue)}`;
        currentValue = String(currentX).replace('.', ',');
        stage = 3;
        operator = null;
        previousValue = null;
        waitingForSecondOperand = false;
        updateDisplay();
        return;
      }

      if (operator === null || previousValue === null) return;
      const num1 = parseFloat(previousValue.replace(',', '.'));
      const num2 = parseFloat(currentValue.replace(',', '.'));
      let result = 0;

      switch (operator) {
        case '+': result = num1 + num2; break;
        case '-': result = num1 - num2; break;
        case '×': result = num1 * num2; break;
        case '÷': result = num2 !== 0 ? num1 / num2 : 'Error'; break;
      }

      expressionLineEl.innerText = `${formatNumber(previousValue)}${operator}${formatNumber(currentValue)}`;
      currentValue = String(result).replace('.', ',');
      operator = null;
      previousValue = null;
      waitingForSecondOperand = false;
      updateDisplay();
    }

    function handleAC() {
      currentValue = '0';
      previousValue = null;
      operator = null;
      waitingForSecondOperand = false;
      stage = 0;
      currentX = 0;
      targetResult = 0;
      forcedAddendStr = '';
      forcedIndex = 0;
      expressionLineEl.innerText = '';
      updateDisplay();
    }

    function handleBackspace() {
      if (waitingForSecondOperand || stage === 4) return;
      if (currentValue.length > 1) {
        currentValue = currentValue.slice(0, -1);
      } else {
        currentValue = '0';
      }
      updateDisplay();
    }

    function toggleSign() {
      if (currentValue === '0' || stage === 4) return;
      currentValue = currentValue.startsWith('-') ? currentValue.substring(1) : '-' + currentValue;
      updateDisplay();
    }

    function inputDecimal() {
      if (stage === 4) return;
      if (waitingForSecondOperand) {
        currentValue = '0,';
        waitingForSecondOperand = false;
        updateDisplay();
        return;
      }
      if (!currentValue.includes(',')) {
        currentValue += ',';
        updateDisplay();
      }
    }
  </script>
</body>
</html>
