<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Calculadora</title>
  
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icon.png">
  
  <meta property="og:title" content="Calculadora">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://manucaama93.github.io/icon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: 0;
      padding-left: 10px;
      padding-right: 10px;
      padding-bottom: max(4px, env(safe-area-inset-bottom, 4px));
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: calc(env(safe-area-inset-top, 0px) + 8px);
      padding-left: 4px;
      padding-right: 4px;
    }

    .top-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .top-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .display-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 0 2px 12px 2px;
      overflow: hidden;
      width: 100%;
    }

    .expression-line {
      font-size: 22px;
      font-weight: 400;
      color: #8e8e93;
      text-align: right;
      min-height: 26px;
      line-height: 1.2;
      letter-spacing: -0.5px;
      width: 100%;
    }

    .main-line-wrapper {
      width: 100%;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      scroll-behavior: auto;
    }

    .main-line-wrapper::-webkit-scrollbar {
      display: none;
    }

    .main-line {
      font-size: 76px;
      font-weight: 400;
      color: #fff;
      display: inline-block;
      line-height: 1.05;
      letter-spacing: -1.2px;
      float: right;
      min-width: 100%;
      text-align: right;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: max(4px, env(safe-area-inset-bottom, 4px));
    }

    .btn {
      aspect-ratio: 1;
      border-radius: 50%;
      font-size: 38px;
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      position: relative;
      z-index: 1;
      transition: transform 0.12s cubic-bezier(0.2, 0, 0, 1), background-color 0.12s ease;
    }

    .btn.is-pressed {
      transform: scale(1.28) !important;
      z-index: 100 !important;
    }

    .btn-light {
      background-color: #505052;
      color: #ffffff;
      font-size: 36px;
      border: 2px solid #7c7c80;
    }

    .btn-light.is-pressed {
      background-color: #7c7c80 !important;
    }

    .btn-dark {
      background-color: #2c2c2e;
      color: #ffffff;
      border: 2px solid #48484a;
    }

    .btn-dark.is-pressed {
      background-color: #505052 !important;
    }

    .btn-orange {
      background-color: #ff9f0a;
      color: #ffffff;
      font-size: 42px;
      border: 2px solid #ffb340;
    }

    .btn-orange.is-pressed {
      background-color: #fcc169 !important;
    }

    .btn svg {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="top-icon">
      <img src="icon-history.png" alt="Historial">
    </div>

    <div class="top-icon">
      <img src="icon-calc.png" alt="Calculadora">
    </div>
  </div>

  <div class="display-container">
    <div class="expression-line" id="expressionLine"></div>
    <div class="main-line-wrapper" id="mainWrapper">
      <div class="main-line" id="mainLine">0</div>
    </div>
  </div>

  <div class="keypad" id="keypad">
    <button class="btn btn-light" data-action="backspace">
      <svg width="32" height="32" viewBox="0 0 24 24" stroke-width="1.8" stroke="#ffffff">
        <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
        <line x1="18" y1="9" x2="12" y2="15"></line>
        <line x1="12" y1="9" x2="18" y2="15"></line>
      </svg>
    </button>
    <button class="btn btn-light" id="clearBtn" data-action="ac">AC</button>
    <button class="btn btn-light" data-action="operator" data-val="%">%</button>
    <button class="btn btn-orange" data-action="operator" data-val="÷">÷</button>

    <button class="btn btn-dark" data-action="digit" data-val="7">7</button>
    <button class="btn btn-dark" data-action="digit" data-val="8">8</button>
    <button class="btn btn-dark" data-action="digit" data-val="9">9</button>
    <button class="btn btn-orange" data-action="operator" data-val="×">×</button>

    <button class="btn btn-dark" data-action="digit" data-val="4">4</button>
    <button class="btn btn-dark" data-action="digit" data-val="5">5</button>
    <button class="btn btn-dark" data-action="digit" data-val="6">6</button>
    <button class="btn btn-orange" data-action="operator" data-val="-">−</button>

    <button class="btn btn-dark" data-action="digit" data-val="1">1</button>
    <button class="btn btn-dark" data-action="digit" data-val="2">2</button>
    <button class="btn btn-dark" data-action="digit" data-val="3">3</button>
    <button class="btn btn-orange" data-action="operator" data-val="+">+</button>

    <button class="btn btn-dark" data-action="toggleSign">⁺∕₋</button>
    <button class="btn btn-dark" data-action="digit" data-val="0">0</button>
    <button class="btn btn-dark" data-action="decimal">,</button>
    <button class="btn btn-orange" data-action="equal">=</button>
  </div>

  <script>
    const mainLineEl = document.getElementById('mainLine');
    const mainWrapperEl = document.getElementById('mainWrapper');
    const expressionLineEl = document.getElementById('expressionLine');
    const clearBtnEl = document.getElementById('clearBtn');
    const keypadEl = document.getElementById('keypad');

    let currentValue = '0';
    let previousValue = null;
    let operator = null;
    let waitingForSecondOperand = false;

    // Control del truco:
    // Stage 0: Inicio
    // Stage 1: Se ha pulsado '×' (esperando multiplicación inicial)
    // Stage 2: Se completó la multiplicación (tenemos el resultado currentX)
    // Stage 3: Se pulsó '+' (modo forzado activo donde el espectador escribe)
    let stage = 0; 
    let currentX = 0;
    let targetResult = 0;
    let forcedAddendStr = '';
    let forcedIndex = 0;

    function formatNumber(valStr) {
      if (!valStr || valStr === 'Error') return valStr;
      const parts = valStr.split(',');
      let integerPart = parts[0];
      const decimalPart = parts.length > 1 ? ',' + parts[1] : '';

      const isNegative = integerPart.startsWith('-');
      if (isNegative) integerPart = integerPart.substring(1);

      const formattedInteger = integerPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return (isNegative ? '-' : '') + formattedInteger + decimalPart;
    }

    function scrollToRight() {
      requestAnimationFrame(() => {
        mainWrapperEl.scrollLeft = mainWrapperEl.scrollWidth;
      });
    }

    function adjustFontSizeForDisplayText() {
      const maxFontSize = 76;
      const minFontSize = 50; 
      
      mainLineEl.style.fontSize = maxFontSize + 'px';
      
      const containerWidth = mainWrapperEl.clientWidth;
      let currentWidth = mainLineEl.scrollWidth;
      
      if (currentWidth > containerWidth) {
        let currentFontSize = maxFontSize;
        
        while (currentWidth > containerWidth && currentFontSize > minFontSize) {
          currentFontSize -= 1;
          mainLineEl.style.fontSize = currentFontSize + 'px';
          currentWidth = mainLineEl.scrollWidth;
        }
      }

      scrollToRight();
    }

    function updateDisplay() {
      let fullText = '';

      if (stage === 3) {
        const currentTypedAddend = forcedAddendStr.substring(0, forcedIndex);
        const formattedBase = formatNumber(String(currentX));
        const formattedAddend = currentTypedAddend ? formatNumber(currentTypedAddend) : '';
        
        fullText = `${formattedBase}+${formattedAddend}`;
      } else if (operator) {
        const formattedBase = formatNumber(previousValue);
        const formattedSecond = !waitingForSecondOperand ? formatNumber(currentValue) : '';

        fullText = `${formattedBase}${operator}${formattedSecond}`;
      } else {
        fullText = formatNumber(currentValue);
      }

      mainLineEl.innerText = fullText;
      adjustFontSizeForDisplayText();

      clearBtnEl.innerText = (currentValue !== '0' || previousValue !== null || stage === 3) ? 'C' : 'AC';
    }

    function getFutureTargetNumber() {
      const now = new Date();
      now.setMinutes(now.getMinutes() + 2);

      const day = String(now.getDate());
      const month = String(now.getMonth() + 1);
      const year = String(now.getFullYear());
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');

      return parseInt(`${day}${month}${year}${hours}${minutes}`, 10);
    }

    function handleDigitPress(digit) {
      if (stage === 3) {
        if (forcedIndex < forcedAddendStr.length) {
          forcedIndex++;
          updateDisplay();
        }
        return;
      }

      if (waitingForSecondOperand) {
        currentValue = digit;
        waitingForSecondOperand = false;
      } else {
        currentValue = currentValue === '0' ? digit : currentValue + digit;
      }
      updateDisplay();
    }

    function inputOperator(op) {
      if (op === '×' && stage === 0) {
        stage = 1; // Iniciamos truco al multiplicar
      } else if (op === '+' && stage === 2) {
        stage = 3; // Activamos el modo forzado tras el resultado de la multiplicación
        targetResult = getFutureTargetNumber();
        const addendY = targetResult - currentX;
        forcedAddendStr = String(addendY);
        forcedIndex = 0;
        operator = '+';
        previousValue = String(currentX);
        waitingForSecondOperand = false;
        expressionLineEl.innerText = '';
        updateDisplay();
        return;
      }

      operator = op;
      previousValue = currentValue;
      waitingForSecondOperand = true;
      expressionLineEl.innerText = '';
      updateDisplay();
    }

    function handleEqual() {
      if (stage === 3) {
        expressionLineEl.innerText = `${formatNumber(String(currentX))}+${formatNumber(forcedAddendStr)}`;
        currentValue = String(targetResult);
        stage = 0;
        operator = null;
        previousValue = null;
        waitingForSecondOperand = false;
        updateDisplay();
        return;
      }

      if (operator === '×' && stage === 1) {
        const num1 = parseFloat(previousValue.replace(',', '.'));
        const num2 = parseFloat(currentValue.replace(',', '.'));
        currentX = Math.round(num1 * num2);

        expressionLineEl.innerText = `${formatNumber(previousValue)}×${formatNumber(currentValue)}`;
        currentValue = String(currentX).replace('.', ',');
        stage = 2; // Guardamos resultado y pasamos a la etapa previa al '+'
        operator = null;
        previousValue = null;
        waitingForSecondOperand = false;
        updateDisplay();
        return;
      }

      if (operator === null || previousValue === null) return;
      const num1 = parseFloat(previousValue.replace(',', '.'));
      const num2 = parseFloat(currentValue.replace(',', '.'));
      let result = 0;

      switch (operator) {
        case '+': result = num1 + num2; break;
        case '-': result = num1 - num2; break;
        case '×': result = num1 * num2; break;
        case '÷': result = num2 !== 0 ? num1 / num2 : 'Error'; break;
      }

      expressionLineEl.innerText = `${formatNumber(previousValue)}${operator}${formatNumber(currentValue)}`;
      currentValue = String(result).replace('.', ',');
      operator = null;
      previousValue = null;
      waitingForSecondOperand = false;
      updateDisplay();
    }

    function handleAC() {
      currentValue = '0';
      previousValue = null;
      operator = null;
      waitingForSecondOperand = false;
      stage = 0;
      currentX = 0;
      targetResult = 0;
      forcedAddendStr = '';
      forcedIndex = 0;
      expressionLineEl.innerText = '';
      updateDisplay();
    }

    function handleBackspace() {
      if (waitingForSecondOperand || stage === 3) return;
      if (currentValue.length > 1) {
        currentValue = currentValue.slice(0, -1);
      } else {
        currentValue = '0';
      }
      updateDisplay();
    }

    function toggleSign() {
      if (currentValue === '0' || stage === 3) return;
      currentValue = currentValue.startsWith('-') ? currentValue.substring(1) : '-' + currentValue;
      updateDisplay();
    }

    function inputDecimal() {
      if (stage === 3) return;
      if (waitingForSecondOperand) {
        currentValue = '0,';
        waitingForSecondOperand = false;
        updateDisplay();
        return;
      }
      if (!currentValue.includes(',')) {
        currentValue += ',';
        updateDisplay();
      }
    }

    function executeButtonAction(btn) {
      const action = btn.dataset.action;
      const val = btn.dataset.val;

      switch (action) {
        case 'digit':
          handleDigitPress(val);
          break;
        case 'operator':
          inputOperator(val);
          break;
        case 'equal':
          handleEqual();
          break;
        case 'ac':
          handleAC();
          break;
        case 'backspace':
          handleBackspace();
          break;
        case 'toggleSign':
          toggleSign();
          break;
        case 'decimal':
          inputDecimal();
          break;
      }
    }

    function handlePressStart(e) {
      const btn = e.target.closest('.btn');
      if (!btn) return;

      e.preventDefault();
      btn.classList.add('is-pressed');
      executeButtonAction(btn);
    }

    function handlePressEnd(e) {
      const btn = e.target.closest('.btn');
      if (btn) {
        setTimeout(() => {
          btn.classList.remove('is-pressed');
        }, 80);
      } else {
        document.querySelectorAll('.btn.is-pressed').forEach(b => b.classList.remove('is-pressed'));
      }
    }

    keypadEl.addEventListener('touchstart', handlePressStart, { passive: false });
    keypadEl.addEventListener('touchend', handlePressEnd, { passive: false });
    keypadEl.addEventListener('touchcancel', handlePressEnd, { passive: false });

    keypadEl.addEventListener('mousedown', (e) => {
      if ('ontouchstart' in window) return;
      handlePressStart(e);
    });
    keypadEl.addEventListener('mouseup', (e) => {
      if ('ontouchstart' in window) return;
      handlePressEnd(e);
    });
  </script>
</body>
</html>
