<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Calculadora</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 18px 25px 18px;
      overflow: hidden;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      padding-bottom: 10px;
    }

    .top-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: #1c1c1e;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .top-icon svg {
      fill: none;
      stroke: #fff;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .display-container {
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 10px 12px;
      word-break: break-all;
    }

    .display {
      font-size: 80px;
      font-weight: 300;
      color: #fff;
      text-align: right;
      line-height: 1;
      max-width: 100%;
      letter-spacing: -2px;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 10px;
    }

    .btn {
      aspect-ratio: 1;
      border-radius: 50%;
      border: none;
      font-size: 34px;
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      transition: filter 0.1s ease;
    }

    .btn:active {
      filter: brightness(1.4);
    }

    .btn-dark {
      background-color: #2a2a2c;
      color: #fff;
    }

    .btn-orange {
      background-color: #ff9f0a;
      color: #fff;
      font-size: 38px;
    }

    .btn-orange:active {
      filter: brightness(1.2);
    }

    .btn svg {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .home-indicator-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 10px;
    }

    .home-indicator {
      width: 135px;
      height: 5px;
      background-color: #fff;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="top-icon">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <polyline points="12 7 12 12 15 15" />
      </svg>
    </div>
    <div class="top-icon">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <rect x="4" y="4" width="6" height="6" rx="1.5" />
        <rect x="14" y="4" width="6" height="6" rx="1.5" />
        <rect x="4" y="14" width="6" height="6" rx="1.5" />
        <rect x="14" y="14" width="6" height="6" rx="1.5" />
      </svg>
    </div>
  </div>

  <div class="display-container">
    <div class="display" id="display">0</div>
  </div>

  <div class="keypad">
    <button class="btn btn-dark" onclick="handleBackspace()">
      <svg width="28" height="28" viewBox="0 0 24 24" stroke-width="1.8">
        <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
        <line x1="18" y1="9" x2="12" y2="15"></line>
        <line x1="12" y1="9" x2="18" y2="15"></line>
      </svg>
    </button>
    <button class="btn btn-dark" onclick="handleAC()">AC</button>
    <button class="btn btn-dark" onclick="inputOperator('%')">%</button>
    <button class="btn btn-orange" onclick="inputOperator('÷')">÷</button>

    <button class="btn btn-dark" onclick="handleDigitPress('7')">7</button>
    <button class="btn btn-dark" onclick="handleDigitPress('8')">8</button>
    <button class="btn btn-dark" onclick="handleDigitPress('9')">9</button>
    <button class="btn btn-orange" onclick="inputOperator('×')">×</button>

    <button class="btn btn-dark" onclick="handleDigitPress('4')">4</button>
    <button class="btn btn-dark" onclick="handleDigitPress('5')">5</button>
    <button class="btn btn-dark" onclick="handleDigitPress('6')">6</button>
    <button class="btn btn-orange" onclick="inputOperator('-')">−</button>

    <button class="btn btn-dark" onclick="handleDigitPress('1')">1</button>
    <button class="btn btn-dark" onclick="handleDigitPress('2')">2</button>
    <button class="btn btn-dark" onclick="handleDigitPress('3')">3</button>
    <button class="btn btn-orange" onclick="inputOperator('+')">+</button>

    <button class="btn btn-dark" onclick="toggleSign()">⁺∕₋</button>
    <button class="btn btn-dark" onclick="handleDigitPress('0')">0</button>
    <button class="btn btn-dark" onclick="inputDecimal()">,</button>
    <button class="btn btn-orange" onclick="handleEqual()">=</button>
  </div>

  <div class="home-indicator-bar">
    <div class="home-indicator"></div>
  </div>

  <script>
    const displayElement = document.getElementById('display');
    let currentValue = '0';
    let previousValue = null;
    let operator = null;
    let waitingForSecondOperand = false;

    // Control de estados de la rutina:
    // 0: Inicio / Estándar
    // 1: E1 sumó (esperando E2)
    // 2: E2 dio '=' -> Muestra (N1 + N2)
    // 3: E3 multiplicó y dio '=' -> Muestra X = (N1 + N2) * N3
    // 4: Se pulsa '+' -> Modo forzaje activo para E4
    let stage = 0; 
    let currentX = 0;
    let targetResult = 0;
    let forcedAddendStr = '';
    let forcedIndex = 0;

    function updateDisplay(val) {
      displayElement.innerText = val !== undefined ? val : currentValue;
      adjustFontSize();
    }

    function adjustFontSize() {
      const len = displayElement.innerText.length;
      if (len > 10) {
        displayElement.style.fontSize = '35px';
      } else if (len > 7) {
        displayElement.style.fontSize = '50px';
      } else if (len > 5) {
        displayElement.style.fontSize = '65px';
      } else {
        displayElement.style.fontSize = '80px';
      }
    }

    // Genera el número de fecha y hora objetivo (Día Sin Cero Inicial + Mes Sin Cero Inicial + Año + Hora + Minutos)
    // Ejemplo para el 6/9/2026 a las 18:30 -> 6920261830
    function getFutureTargetNumber() {
      const now = new Date();
      now.setMinutes(now.getMinutes() + 5); // +5 minutos de margen

      const day = String(now.getDate());             // Sin '0' delante (ej: 6)
      const month = String(now.getMonth() + 1);     // Sin '0' delante (ej: 9)
      const year = String(now.getFullYear());       // 2026
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');

      return parseInt(`${day}${month}${year}${hours}${minutes}`, 10);
    }

    function handleDigitPress(digit) {
      if (stage === 4) {
        // Fase Espectador 4: Teclea al azar y se van escribiendo los dígitos de Y
        if (forcedIndex < forcedAddendStr.length) {
          if (forcedIndex === 0) {
            currentValue = forcedAddendStr[0];
          } else {
            currentValue += forcedAddendStr[forcedIndex];
          }
          forcedIndex++;
          updateDisplay();
        }
        return;
      }

      if (waitingForSecondOperand) {
        currentValue = digit;
        waitingForSecondOperand = false;
      } else {
        currentValue = currentValue === '0' ? digit : currentValue + digit;
      }
      updateDisplay();
    }

    function inputOperator(op) {
      if (op === '+' && stage === 0) {
        stage = 1; // Pasamos a esperar a E2
      } else if (op === '+' && stage === 3) {
        // Se pulsa '+' después de tener el resultado X -> Se activa la trampa
        stage = 4;
        targetResult = getFutureTargetNumber();
        const addendY = targetResult - currentX;
        forcedAddendStr = String(addendY);
        forcedIndex = 0;
        operator = '+';
        waitingForSecondOperand = true;
        return;
      }

      operator = op;
      previousValue = currentValue;
      waitingForSecondOperand = true;
    }

    function handleEqual() {
      if (stage === 4) {
        // Espectador 4 pulsa '=' -> Se revela el resultado final de fecha y hora
        currentValue = String(targetResult);
        stage = 0;
        operator = null;
        previousValue = null;
        waitingForSecondOperand = false;
        updateDisplay();
        return;
      }

      if (operator === '+' && stage === 1) {
        // Espectador 2 pulsa '=' -> Muestra la suma real (N1 + N2)
        const num1 = parseFloat(previousValue.replace(',', '.'));
        const num2 = parseFloat(currentValue.replace(',', '.'));
        const sum = num1 + num2;

        currentValue = String(sum).replace('.', ',');
        stage = 2; // Esperando presionar '×'
        operator = null;
        previousValue = null;
        waitingForSecondOperand = false;
        updateDisplay();
        return;
      }

      if (operator === '×' && stage === 2) {
        // Espectador 3 pulsa '=' -> Muestra el resultado real X = (N1 + N2) * N3
        const num1 = parseFloat(previousValue.replace(',', '.'));
        const num2 = parseFloat(currentValue.replace(',', '.'));
        currentX = Math.round(num1 * num2);

        currentValue = String(currentX).replace('.', ',');
        stage = 3; // Esperando presionar '+'
        operator = null;
        previousValue = null;
        waitingForSecondOperand = false;
        updateDisplay();
        return;
      }

      // Operación normal
      if (operator === null || previousValue === null) return;
      const num1 = parseFloat(previousValue.replace(',', '.'));
      const num2 = parseFloat(currentValue.replace(',', '.'));
      let result = 0;

      switch (operator) {
        case '+': result = num1 + num2; break;
        case '-': result = num1 - num2; break;
        case '×': result = num1 * num2; break;
        case '÷': result = num2 !== 0 ? num1 / num2 : 'Error'; break;
      }

      currentValue = String(result).replace('.', ',');
      operator = null;
      previousValue = null;
      waitingForSecondOperand = false;
      updateDisplay();
    }

    function handleAC() {
      currentValue = '0';
      previousValue = null;
      operator = null;
      waitingForSecondOperand = false;
      stage = 0;
      currentX = 0;
      targetResult = 0;
      forcedAddendStr = '';
      forcedIndex = 0;
      updateDisplay();
    }

    function handleBackspace() {
      if (waitingForSecondOperand || stage === 4) return;
      if (currentValue.length > 1) {
        currentValue = currentValue.slice(0, -1);
      } else {
        currentValue = '0';
      }
      updateDisplay();
    }

    function toggleSign() {
      if (currentValue === '0' || stage === 4) return;
      currentValue = currentValue.startsWith('-') ? currentValue.substring(1) : '-' + currentValue;
      updateDisplay();
    }

    function inputDecimal() {
      if (stage === 4) return;
      if (waitingForSecondOperand) {
        currentValue = '0,';
        waitingForSecondOperand = false;
        updateDisplay();
        return;
      }
      if (!currentValue.includes(',')) {
        currentValue += ',';
        updateDisplay();
      }
    }
  </script>
</body>
</html>
